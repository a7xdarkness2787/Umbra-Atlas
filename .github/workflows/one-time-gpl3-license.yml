name: Apply GPL-3.0-only license

on:
  push:
    branches:
      - gpl3-license-work

permissions:
  contents: write

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add official GPLv3 text
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://www.gnu.org/licenses/gpl-3.0.txt --output LICENSE
          grep -q 'GNU GENERAL PUBLIC LICENSE' LICENSE
          grep -q 'Version 3, 29 June 2007' LICENSE

          cat > LICENSE-NOTICE <<'EOF'
          Umbra-Atlas-TV
          Copyright (C) 2026 Umbra Project
          SPDX-License-Identifier: GPL-3.0-only

          This project is licensed under version 3 only of the GNU General Public License.
          The complete, unmodified GPLv3 text is in LICENSE.
          EOF

          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8').rstrip()
          if '## License' not in text:
              text += '\n\n## License\n\nGNU GPL v3.0 only. See `LICENSE` and `LICENSE-NOTICE`.\n'
          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/one-time-gpl3-license.yml .gpl3-license-trigger
          git config user.name 'Umbra License Setup'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'License project under GPL-3.0-only'
          git push origin HEAD:gpl3-license-ready
