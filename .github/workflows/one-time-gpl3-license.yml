name: One-time GPL-3.0-only license setup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-gpl3-license.yml

permissions:
  contents: write

jobs:
  add-license:
    if: ${{ github.event.head_commit.message != 'License project under GPL-3.0-only' && github.event.head_commit.message != 'Remove one-time GPL license workflow' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the official GPLv3 text and project notice
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://www.gnu.org/licenses/gpl-3.0.txt \
            --output LICENSE
          grep -q 'GNU GENERAL PUBLIC LICENSE' LICENSE
          grep -q 'Version 3, 29 June 2007' LICENSE

          repo_name="${GITHUB_REPOSITORY#*/}"
          cat > LICENSE-NOTICE <<EOF
          ${repo_name}
          Copyright (C) 2026 Umbra Project
          SPDX-License-Identifier: GPL-3.0-only

          This project is licensed under version 3 only of the GNU General Public License.
          The complete, unmodified GPLv3 text is in LICENSE.
          EOF

          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          if path.exists():
              text = path.read_text(encoding="utf-8").rstrip()
              if "## License" not in text:
                  text += "\n\n## License\n\nGNU GPL v3.0 only. See `LICENSE` and `LICENSE-NOTICE`.\n"
                  path.write_text(text, encoding="utf-8")
          PY

          git config user.name 'Umbra License Setup'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add LICENSE LICENSE-NOTICE README.md 2>/dev/null || git add LICENSE LICENSE-NOTICE
          git commit -m 'License project under GPL-3.0-only'
          git push origin HEAD:main
